[project]
name = "phyanim"
version = "0.1.0"
description = "Physics-first animation modeling MVP."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "manim",
    "matplotlib",
    "flask",
    "manim-voiceover",
    "python-docx",
    "langgraph",
    "langchain-core",
    "langchain-openai",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phyanim*"]
exclude = ["outputs*", "examples*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
